[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpick3"
version = "0.1.0"
description = "麦麦三问 McPick3：基于麦当劳 MCP 的可解释点餐决策卡"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "McPick3 contributors"}]
license = {text = "MIT"}
dependencies = []

[project.scripts]
mcpick3 = "mcpick3.cli:main"
mcpick3-web = "mcpick3.web:main"

[tool.setuptools.packages.find]
where = ["src"]

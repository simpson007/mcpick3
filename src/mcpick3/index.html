<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>麦麦三问 · McPick3</title>
<style>
:root{--ink:#30241c;--muted:#786c62;--red:#c83425;--line:#e5dfd5}
*{box-sizing:border-box}body{margin:0;background:#f6f4ee;color:var(--ink);font:15px system-ui,-apple-system,"PingFang SC",sans-serif}
.wrap{max-width:1080px;padding:32px 24px 50px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;padding-bottom:24px;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:-.5px;font-size:24px}.brand span{color:var(--red)}.badge{background:#ece7dc;border-radius:20px;padding:7px 12px;font-size:12px}
.hero{padding:30px 0 24px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--red);font-weight:700}h1{font-size:38px;line-height:1.2;margin:12px 0}p{color:var(--muted);line-height:1.65}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:11px 16px;background:var(--red);color:white;font-weight:700}button:disabled{opacity:.55;cursor:wait}.secondary{background:#eee9e0;color:var(--ink)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 4px}.quick button{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font-size:13px;font-weight:600}.quick button:hover,.quick button:focus{border-color:var(--red);color:var(--red);outline:none}.quick button.active{background:#fff0ec;border-color:var(--red);color:var(--red)}
.form{background:#fff;border:1px solid var(--line);padding:22px;border-radius:14px}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:14px 0}label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}input,select{width:100%;padding:11px;background:#fbfaf7;border:1px solid var(--line);border-radius:8px}.locations{grid-template-columns:1fr 1.5fr auto;align-items:end}.locations button{white-space:nowrap}.actions{display:flex;justify-content:space-between;align-items:center;gap:15px;border-top:1px solid var(--line);padding-top:16px;margin-top:18px}.small{font-size:12px;color:var(--muted)}.error{background:#fff0ec;color:#9e291e;padding:15px;border-radius:8px;margin-top:18px}.status{margin:18px 0;line-height:1.7;color:var(--muted);font-size:13px}.store{background:#eeeae0;padding:15px;border-radius:10px}.store strong{display:block;color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}.card{background:white;border:1px solid var(--line);border-top:4px solid var(--red);padding:22px;border-radius:12px;display:flex;flex-direction:column}.card:nth-child(2){border-top-color:#bc921e}.card:nth-child(3){border-top-color:#45715b}.card h2{font-size:19px;margin:0 0 6px}.price{font-size:36px;letter-spacing:-1px;font-weight:800;margin:16px 0 3px}.verified{font-size:11px;border-radius:5px;background:#e9f2eb;color:#366549;padding:4px 7px;display:inline-block}.unverified{background:#f3ede1;color:#856d37}.meal{font-size:17px;font-weight:700;line-height:1.5;min-height:52px;margin:16px 0}.stats{font-size:13px;display:flex;gap:12px;border-top:1px solid var(--line);padding-top:13px}.reasons{padding-left:16px;font-size:13px;line-height:1.8;color:var(--muted);flex:1}.card button{margin-top:10px;width:100%}details{font-size:12px;line-height:1.8;padding-top:10px}summary{cursor:pointer;color:var(--muted)}.combo-option{margin:7px 0;padding:8px 10px;background:#faf8f3;border-radius:7px}.combo-option strong{display:block;color:var(--ink)}.combo-choice{color:var(--muted);font-size:11px}.draft{background:white;border:1px solid var(--line);padding:20px;border-radius:12px}.draft pre{background:#f6f4ee;border-radius:8px;padding:16px;overflow:auto;font-size:12px}footer{border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:12px;line-height:1.8}.hidden{display:none}
@media(max-width:800px){.cards{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.locations{grid-template-columns:1fr 1fr}.locations button{grid-column:1/-1}h1{font-size:30px}.actions{align-items:start;flex-direction:column}}@media(max-width:450px){.row{grid-template-columns:1fr}.wrap{padding:22px 15px}.badge{font-size:10px}}
</style>
</head>
<body><main class="wrap">
<header><div class="brand">Mc<span>Pick3</span> <small>麦麦三问</small></div><span class="badge" id="token-status">正在检查本地配置</span></header>
<section class="hero"><div class="eyebrow">MC PICK 3 · 今天吃啥</div><h1>不用纠结，<br>3 个数直接出结果。</h1><p>预算、热量、还剩几分钟。选一个就走，别在菜单里迷路。</p><div class="quick" aria-label="快速开始"><button type="button" data-preset="lunch">午休 20 分钟</button><button type="button" data-preset="save">月底省一点</button><button type="button" data-preset="mood">今天想吃爽的</button></div></section>
<form class="form" id="form">
<div class="row"><div><label for="source">数据来源</label><select id="source" name="source"><option value="demo">本地演示 · 无需 Token</option><option value="live">实时 MCP · 官方菜单与校价</option></select></div><div><label for="mode">取餐方式</label><select id="mode" name="mode"><option value="pickup">到店取餐</option><option value="dine_in">堂食</option></select></div></div>
<section id="live-fields" class="hidden"><div class="row locations"><div><label for="city">城市</label><input id="city" name="city" value="上海市" maxlength="100"></div><div><label for="keyword">附近位置</label><input id="keyword" name="keyword" value="人民广场" maxlength="100"></div><button type="button" class="secondary" id="search">查找门店</button></div><label for="store">选择门店</label><select id="store" name="storeCode"><option value="">先查找门店，或自动选首家营业门店</option></select><div id="store-preview" class="small"></div></section>
<div class="row"><div><label for="budget">① 今天想花</label><input id="budget" name="budget" type="number" min="1" max="500" step="0.5" value="35" required></div><div><label for="kcal">② 最多吃到</label><input id="kcal" name="kcal" type="number" min="50" max="5000" value="700" required><span class="small">kcal</span></div><div><label for="minutes">③ 还剩几分钟</label><input id="minutes" name="minutes" type="number" min="1" max="180" value="25" required><span class="small">分钟</span></div></div>
<div class="actions"><span class="small">实时模式会查当前门店菜单和价格。<br>不自动下单，不会碰你的支付。</span><button id="generate" type="submit">给我 3 个选择 →</button></div>
</form>
<div id="error" class="error hidden" role="alert"></div><div id="status" class="status" aria-live="polite"></div><div id="cards" class="cards"></div><section id="draft" class="draft hidden"></section>
<footer>非麦当劳官方产品 · 仅供参考，不构成医疗或专业营养建议。<br>实时结果受门店、时段和供应影响。网页只查询与生成草稿，不创建订单、不付款、不自动领券。</footer>
</main>
<script>
const $=s=>document.querySelector(s), f=$('#form');let stores=[],result=null,rerollExclude=[],rerollIndex=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toFixed(2);
function error(message){$('#error').textContent=message;$('#error').classList.toggle('hidden',!message)}
async function request(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.error||'请求失败');return data}
function values(){const data=Object.fromEntries(new FormData(f));if(rerollExclude.length)data.exclude=rerollExclude;if(window.__replacement)data.replacement=window.__replacement;return data}
function resetStore(){stores=[];$('#store').innerHTML='<option value="">先查找门店，或自动选首家营业门店</option>';$('#store-preview').textContent=''}
const presets={lunch:{budget:35,kcal:700,minutes:20},save:{budget:25,kcal:650,minutes:25},mood:{budget:50,kcal:1000,minutes:35}};
document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{const p=presets[b.dataset.preset];Object.entries(p).forEach(([k,v])=>$('#'+k).value=v);document.querySelectorAll('[data-preset]').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#status').textContent=`已套用「${b.textContent}」，点一下“给我 3 个选择”就行。`;f.scrollIntoView({behavior:'smooth',block:'center'})});
$('#city').addEventListener('input',resetStore);$('#keyword').addEventListener('input',resetStore);
$('#source').onchange=()=>{$('#live-fields').classList.toggle('hidden',$('#source').value!=='live');$('#cards').innerHTML='';$('#draft').classList.add('hidden');result=null;$('#status').textContent='';error('')};
$('#search').onclick=async()=>{error('');$('#search').disabled=true;$('#status').textContent='正在查询官方门店…';try{const data=await request('/api/stores',values());stores=data.stores;$('#store').innerHTML=stores.map(s=>`<option value="${esc(s.storeCode)}" ${s.businessStatus===false?'disabled':''}>${esc(s.storeName)} · ${esc(s.distance)}m · ${esc(s.storeCode)}</option>`).join('');$('#store').dispatchEvent(new Event('change'));$('#status').textContent=`找到 ${stores.length} 家门店，请选择后生成决策卡。`}catch(e){error(e.message);$('#status').textContent=''}finally{$('#search').disabled=false}};
$('#store').onchange=()=>{const s=stores.find(s=>s.storeCode===$('#store').value);$('#store-preview').innerHTML=s?storeHTML(s):''};
function storeHTML(s){return `<div class="store"><strong>${esc(s.storeName)}</strong>${esc(s.address)} · storeCode ${esc(s.storeCode)}${s.beCode?' · beCode '+esc(s.beCode):''}${s.reservation?'<details><summary>全部可预约时段</summary>'+s.reservationTimeOptions.map(t=>esc(t.date)+(t.today?'（今天）':'')+'：'+esc(t.reservationOptionText)).join('<br>')+'</details>':''}</div>`}
function detailsHTML(details){if(!details||!details.length)return '演示模式：暂无官方详情';return details.map(d=>{const defaults=(d.defaults||[]).map(x=>esc(x.name)).join(' + ');const options=(d.options||[]).map(group=>`<div class="combo-option"><strong>${esc(group.name)}</strong><div class="combo-choice">${group.choices.map(x=>(x.default?'默认：':'可换：')+esc(x.name)).join(' · ')}</div></div>`).join('');return `<div><b>${esc(d.name||'餐品')}</b>${defaults?`<br><span class="small">默认：${defaults}</span>`:''}${options}</div>`}).join('<hr>')}
f.onsubmit=async e=>{e.preventDefault();const previous=result,replaceAt=rerollIndex;rerollIndex=null;error('');$('#generate').disabled=true;if(replaceAt===null)$('#cards').innerHTML='';$('#draft').classList.add('hidden');$('#status').textContent=$('#source').value==='live'?'正在读取官方菜单、营养和详情，并逐卡实时校价…':'正在生成演示卡…';try{result=await request('/api/recommend',values());if(previous&&replaceAt!==null&&result.cards.length===1){const replacementCard=result.cards[0];result.cards=previous.cards.slice();result.cards[replaceAt]=replacementCard;}rerollExclude=[];window.__replacement=null;$('#status').innerHTML=storeHTML(result.store)+'<p>'+result.warnings.map(esc).join('<br>')+'</p>';
$('#cards').innerHTML=result.cards.map((c,i)=>`<article class="card"><h2>${esc(c.title)}</h2><span class="small">${esc(c.subtitle)}</span><div class="price">¥${money(c.total)}</div><span class="small">原价 ¥${money(c.subtotal)} · 优惠 ¥${money(c.discount)}</span><div><span class="verified ${c.price_verified?'':'unverified'}">${c.price_verified?'刚刚查过 ✓':'演示数据 · 本地估价'}</span></div><div class="meal">${c.items.map(esc).join(' + ')}</div><div class="stats"><span>${esc(c.kcal)} kcal</span><span>${esc(c.protein_g)} g 蛋白质</span></div><ul class="reasons">${c.reasons.map(r=>'<li>'+esc(r)+'</li>').join('')}</ul><details><summary>看组成和价格明细</summary>${detailsHTML(c.details)}<hr>${c.evidence.map(esc).join('<br>')}</details><button type="button" class="secondary" data-draft="${i}">先存这单</button><button type="button" class="secondary" data-reroll="${i}" data-preference="any">换一个</button><button type="button" class="secondary mini-action" data-reroll="${i}" data-preference="cheaper">便宜点</button><button type="button" class="secondary mini-action" data-reroll="${i}" data-preference="lighter">低卡点</button><button type="button" class="secondary" data-share="${i}">复制这张卡</button></article>`).join('');}catch(e){result=previous||null;rerollExclude=[];window.__replacement=null;error(e.message);$('#status').textContent=''}finally{$('#generate').disabled=false}};
$('#cards').onclick=async e=>{const reroll=e.target.closest('[data-reroll]');if(reroll&&result){const old=result.cards[Number(reroll.dataset.reroll)];rerollExclude=[old.meal_ids||old.product_codes||[]];rerollIndex=Number(reroll.dataset.reroll);window.__replacement={mode:old.mode,preference:reroll.dataset.preference||'any',reference_total:old.total,reference_kcal:old.kcal};$('#form').dispatchEvent(new Event('submit',{cancelable:true}));return}const share=e.target.closest('[data-share]');if(share&&result){const c=result.cards[Number(share.dataset.share)];const text=`${c.title}｜${c.items.join(' + ')}｜¥${money(c.total)}｜${c.kcal} kcal\n${c.reasons.join('；')}`;try{await navigator.clipboard.writeText(text);share.textContent='已复制 ✓';setTimeout(()=>share.textContent='复制这张卡',1600)}catch(_){window.prompt('复制这张卡',text)}return}const b=e.target.closest('[data-draft]');if(!b||!result)return;const card=result.cards[Number(b.dataset.draft)];$('#draft').innerHTML='<h2>这单先存着 · '+esc(card.title)+'</h2><p>'+esc(card.draft.note)+'</p><pre>'+esc(JSON.stringify(card.draft,null,2))+'</pre><button type="button" id="download">存成草稿 JSON</button>';$('#draft').classList.remove('hidden');$('#download').onclick=()=>{const blob=new Blob([JSON.stringify(card.draft,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mcpick3-draft.json';a.click();URL.revokeObjectURL(a.href)};$('#draft').scrollIntoView({behavior:'smooth',block:'start'})};
fetch('/api/status').then(r=>r.json()).then(d=>$('#token-status').textContent=d.token_configured?'本地 Token 已配置 · 查询服务':'演示可用 · 实时模式需配置 Token').catch(()=>$('#token-status').textContent='本地服务状态未知');
f.dispatchEvent(new Event('submit',{cancelable:true}));
</script>
</body></html>

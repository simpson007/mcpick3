<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>麦麦三问 · McPick3</title>
<style>
:root{--ink:#30241c;--muted:#786c62;--red:#c83425;--line:#e5dfd5}
*{box-sizing:border-box}body{margin:0;background:#f6f4ee;color:var(--ink);font:15px system-ui,-apple-system,"PingFang SC",sans-serif}
.wrap{max-width:1080px;padding:32px 24px 50px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;padding-bottom:24px;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:-.5px;font-size:24px}.brand span{color:var(--red)}.badge{background:#ece7dc;border-radius:20px;padding:7px 12px;font-size:12px}
.hero{padding:30px 0 24px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--red);font-weight:700}h1{font-size:38px;line-height:1.2;margin:12px 0}p{color:var(--muted);line-height:1.65}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:11px 16px;background:var(--red);color:white;font-weight:700}button:disabled{opacity:.55;cursor:wait}.secondary{background:#eee9e0;color:var(--ink)}
.form{background:#fff;border:1px solid var(--line);padding:22px;border-radius:14px}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:14px 0}label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}input,select{width:100%;padding:11px;background:#fbfaf7;border:1px solid var(--line);border-radius:8px}.locations{grid-template-columns:1fr 1.5fr auto;align-items:end}.locations button{white-space:nowrap}.actions{display:flex;justify-content:space-between;align-items:center;gap:15px;border-top:1px solid var(--line);padding-top:16px;margin-top:18px}.small{font-size:12px;color:var(--muted)}.error{background:#fff0ec;color:#9e291e;padding:15px;border-radius:8px;margin-top:18px}.status{margin:18px 0;line-height:1.7;color:var(--muted);font-size:13px}.store{background:#eeeae0;padding:15px;border-radius:10px}.store strong{display:block;color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}.card{background:white;border:1px solid var(--line);border-top:4px solid var(--red);padding:22px;border-radius:12px;display:flex;flex-direction:column}.card:nth-child(2){border-top-color:#bc921e}.card:nth-child(3){border-top-color:#45715b}.card h2{font-size:19px;margin:0 0 6px}.price{font-size:36px;letter-spacing:-1px;font-weight:800;margin:16px 0 3px}.verified{font-size:11px;border-radius:5px;background:#e9f2eb;color:#366549;padding:4px 7px;display:inline-block}.unverified{background:#f3ede1;color:#856d37}.meal{font-size:17px;font-weight:700;line-height:1.5;min-height:52px;margin:16px 0}.stats{font-size:13px;display:flex;gap:12px;border-top:1px solid var(--line);padding-top:13px}.reasons{padding-left:16px;font-size:13px;line-height:1.8;color:var(--muted);flex:1}.card button{margin-top:10px;width:100%}details{font-size:12px;line-height:1.8;padding-top:10px}summary{cursor:pointer;color:var(--muted)}.draft{background:white;border:1px solid var(--line);padding:20px;border-radius:12px}.draft pre{background:#f6f4ee;border-radius:8px;padding:16px;overflow:auto;font-size:12px}footer{border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:12px;line-height:1.8}.hidden{display:none}
@media(max-width:800px){.cards{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.locations{grid-template-columns:1fr 1fr}.locations button{grid-column:1/-1}h1{font-size:30px}.actions{align-items:start;flex-direction:column}}@media(max-width:450px){.row{grid-template-columns:1fr}.wrap{padding:22px 15px}.badge{font-size:10px}}
</style>
</head>
<body><main class="wrap">
<header><div class="brand">Mc<span>Pick3</span> <small>麦麦三问</small></div><span class="badge" id="token-status">正在检查本地配置</span></header>
<section class="hero"><div class="eyebrow">THREE QUESTIONS. ONE GOOD LUNCH.</div><h1>少翻菜单，<br>多留一点午休时间。</h1><p>告诉我们预算、热量和取餐偏好。三张卡，帮你看清不同选择。</p></section>
<form class="form" id="form">
<div class="row"><div><label for="source">数据来源</label><select id="source" name="source"><option value="demo">本地演示 · 无需 Token</option><option value="live">实时 MCP · 官方菜单与校价</option></select></div><div><label for="mode">取餐方式</label><select id="mode" name="mode"><option value="pickup">到店取餐</option><option value="dine_in">堂食</option></select></div></div>
<section id="live-fields" class="hidden"><div class="row locations"><div><label for="city">城市</label><input id="city" name="city" value="上海市" maxlength="100"></div><div><label for="keyword">附近位置</label><input id="keyword" name="keyword" value="人民广场" maxlength="100"></div><button type="button" class="secondary" id="search">查找门店</button></div><label for="store">选择门店</label><select id="store" name="storeCode"><option value="">先查找门店，或自动选首家营业门店</option></select><div id="store-preview" class="small"></div></section>
<div class="row"><div><label for="budget">① 预算 / 元</label><input id="budget" name="budget" type="number" min="1" max="500" step="0.5" value="35" required></div><div><label for="kcal">② 能量上限 / kcal</label><input id="kcal" name="kcal" type="number" min="50" max="5000" value="700" required></div><div><label for="minutes">③ 午休时间 / 分钟</label><input id="minutes" name="minutes" type="number" min="1" max="180" value="25" required></div></div>
<div class="actions"><span class="small">时间用于记录偏好，不是出餐或配送时效承诺。<br>Token 仅由本地后端读取，不传给浏览器。</span><button id="generate" type="submit">生成我的三张卡 →</button></div>
</form>
<div id="error" class="error hidden" role="alert"></div><div id="status" class="status" aria-live="polite"></div><div id="cards" class="cards"></div><section id="draft" class="draft hidden"></section>
<footer>非麦当劳官方产品 · 仅供参考，不构成医疗或专业营养建议。<br>实时结果受门店、时段和供应影响。网页只查询与生成草稿，不创建订单、不付款、不自动领券。</footer>
</main>
<script>
const $=s=>document.querySelector(s), f=$('#form');let stores=[],result=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toFixed(2);
function error(message){$('#error').textContent=message;$('#error').classList.toggle('hidden',!message)}
async function request(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw new Error(data.error||'请求失败');return data}
function values(){return Object.fromEntries(new FormData(f))}
function resetStore(){stores=[];$('#store').innerHTML='<option value="">先查找门店，或自动选首家营业门店</option>';$('#store-preview').textContent=''}
$('#city').addEventListener('input',resetStore);$('#keyword').addEventListener('input',resetStore);
$('#source').onchange=()=>{$('#live-fields').classList.toggle('hidden',$('#source').value!=='live');$('#cards').innerHTML='';$('#draft').classList.add('hidden');result=null;$('#status').textContent='';error('')};
$('#search').onclick=async()=>{error('');$('#search').disabled=true;$('#status').textContent='正在查询官方门店…';try{const data=await request('/api/stores',values());stores=data.stores;$('#store').innerHTML=stores.map(s=>`<option value="${esc(s.storeCode)}" ${s.businessStatus===false?'disabled':''}>${esc(s.storeName)} · ${esc(s.distance)}m · ${esc(s.storeCode)}</option>`).join('');$('#store').dispatchEvent(new Event('change'));$('#status').textContent=`找到 ${stores.length} 家门店，请选择后生成决策卡。`}catch(e){error(e.message);$('#status').textContent=''}finally{$('#search').disabled=false}};
$('#store').onchange=()=>{const s=stores.find(s=>s.storeCode===$('#store').value);$('#store-preview').innerHTML=s?storeHTML(s):''};
function storeHTML(s){return `<div class="store"><strong>${esc(s.storeName)}</strong>${esc(s.address)} · storeCode ${esc(s.storeCode)}${s.beCode?' · beCode '+esc(s.beCode):''}${s.reservation?'<details><summary>全部可预约时段</summary>'+s.reservationTimeOptions.map(t=>esc(t.date)+(t.today?'（今天）':'')+'：'+esc(t.reservationOptionText)).join('<br>')+'</details>':''}</div>`}
f.onsubmit=async e=>{e.preventDefault();error('');$('#generate').disabled=true;$('#cards').innerHTML='';$('#draft').classList.add('hidden');$('#status').textContent=$('#source').value==='live'?'正在读取官方菜单、营养和详情，并逐卡实时校价…':'正在生成演示卡…';try{result=await request('/api/recommend',values());$('#status').innerHTML=storeHTML(result.store)+'<p>'+result.warnings.map(esc).join('<br>')+'</p>';
$('#cards').innerHTML=result.cards.map((c,i)=>`<article class="card"><h2>${esc(c.title)}</h2><span class="small">${esc(c.subtitle)}</span><div class="price">¥${money(c.total)}</div><span class="small">原价 ¥${money(c.subtotal)} · 优惠 ¥${money(c.discount)}</span><div><span class="verified ${c.price_verified?'':'unverified'}">${c.price_verified?'官方实时校价 ✓':'演示数据 · 本地估价'}</span></div><div class="meal">${c.items.map(esc).join(' + ')}</div><div class="stats"><span>${esc(c.kcal)} kcal</span><span>${esc(c.protein_g)} g 蛋白质</span></div><ul class="reasons">${c.reasons.map(r=>'<li>'+esc(r)+'</li>').join('')}</ul><details><summary>餐品详情与证据</summary>${c.details.length?c.details.map(d=>esc(d.name)+(d.supportModify?'【可特调】':'')+'<br>'+d.defaults.map(x=>esc(x.name)).join(' + ')).join('<br>'):'本地演示：暂无官方详情'}<hr>${c.evidence.map(esc).join('<br>')}</details><button type="button" class="secondary" data-draft="${i}">查看订单草稿</button></article>`).join('');}catch(e){result=null;error(e.message);$('#status').textContent=''}finally{$('#generate').disabled=false}};
$('#cards').onclick=e=>{const b=e.target.closest('[data-draft]');if(!b||!result)return;const card=result.cards[Number(b.dataset.draft)];$('#draft').innerHTML='<h2>订单草稿 · '+esc(card.title)+'</h2><p>'+esc(card.draft.note)+'</p><pre>'+esc(JSON.stringify(card.draft,null,2))+'</pre><button type="button" id="download">下载草稿 JSON</button>';$('#draft').classList.remove('hidden');$('#download').onclick=()=>{const blob=new Blob([JSON.stringify(card.draft,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mcpick3-draft.json';a.click();URL.revokeObjectURL(a.href)};$('#draft').scrollIntoView({behavior:'smooth',block:'start'})};
fetch('/api/status').then(r=>r.json()).then(d=>$('#token-status').textContent=d.token_configured?'本地 Token 已配置 · 查询服务':'演示可用 · 实时模式需配置 Token').catch(()=>$('#token-status').textContent='本地服务状态未知');
f.dispatchEvent(new Event('submit',{cancelable:true}));
</script>
</body></html>
